<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dugu Dugu Battle</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#6d3d8f;overflow:hidden;font-family:Arial,sans-serif;color:white}
h1{text-align:center;font-size:26px;margin:12px 0;pointer-events:none;letter-spacing:4px;font-weight:900;background:linear-gradient(90deg,#fff,#ffe66d,#ff8cf0,#7cf3ff,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleShine 5s linear infinite;filter:drop-shadow(0 0 10px #d36bffcc)}
.ico{-webkit-text-fill-color:initial;display:inline-block;animation:icoBob 1.6s ease-in-out infinite alternate}
#menu{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:linear-gradient(145deg,#2a0f3f,#5b2a7d);overflow:auto;padding:18px}
.menu-card{width:min(900px,96vw);padding:22px;border:2px solid #b972df;border-radius:18px;background:linear-gradient(145deg,#63307dcc,#271133ee);box-shadow:0 0 40px #bb5eff88;text-align:center}
.menu-card h2{margin:6px 0 16px;font-size:26px;letter-spacing:3px;background:linear-gradient(90deg,#fff,#ffe66d,#ff8cf0,#7cf3ff,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleShine 4s linear infinite}
.mode-row{display:flex;gap:12px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.mode-btn{padding:12px 22px;border:2px solid #b972df;border-radius:12px;background:#ffffff14;color:white;font-weight:bold;font-size:18px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.mode-btn:hover{transform:scale(1.06);box-shadow:0 0 18px #d36bff}
.mode-btn.active{border-color:#ffe66d;box-shadow:0 0 18px #ffe66d;background:#ffe66d22}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.pick{padding:10px;border:2px solid #ffffff30;border-radius:12px;background:#ffffff10;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.pick:hover{transform:scale(1.05)}
.pick.selected{border-color:var(--c);box-shadow:0 0 16px var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.pick img{width:78px;height:58px;object-fit:contain;border-radius:8px;background:#ffffff22}
.pick .nm{font-weight:bold;margin-top:5px}
.pick .rl{font-size:11px;opacity:.8}
#startFight{padding:13px 30px;border:0;border-radius:10px;background:white;color:#2a0f3f;font-weight:bold;font-size:19px;cursor:pointer;transition:transform .15s,box-shadow .15s}
#startFight:hover{transform:scale(1.07);box-shadow:0 0 24px #ffe66d}
#startFight:disabled{opacity:.45;cursor:not-allowed}
.menu-note{margin-top:10px;font-size:12px;opacity:.75}
#ambientBtn{margin-top:12px;padding:10px 18px;border:1px solid #b972df;border-radius:10px;background:#ffffff12;color:white;font-weight:bold;cursor:pointer}
#ambientBtn:hover{background:#ffffff22;box-shadow:0 0 16px #d36bff88}
#arena{position:absolute;width:min(1360px,94vw);height:min(820px,86vh);left:50%;top:50%;transform:translate(-50%,-50%);border:7px solid #2a1538;border-radius:14px;background:radial-gradient(ellipse at 50% 42%,#bd7bdd 0%,#8b50aa 43%,#60337d 100%);box-shadow:0 0 0 3px #e3b6ff,0 0 26px 6px #d36bff99,0 0 70px 14px #8a3cff55,inset 0 0 130px #1a0828d0;overflow:hidden;contain:layout paint;}
#arena:before{content:"";position:absolute;inset:10px;border:2px dashed #ffffff30;pointer-events:none}
#arena::after{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px),radial-gradient(circle at 20% 30%,#ffffff16 0 2px,transparent 3px),radial-gradient(circle at 74% 68%,#ffffff12 0 2px,transparent 3px);background-size:60px 60px,60px 60px,85px 85px,110px 110px;pointer-events:none}
#btn1{--c:#48faff}#btn2{--c:#ff5c7a}#btn3{--c:#ffa63d}#btn4{--c:#b6ff3d}#btn5{--c:#ff9ff3}#btn6{--c:#7cf3ff}
.character{position:absolute;padding:5px;border:2px solid var(--c);border-radius:10px;text-align:center;color:white;font-weight:bold;font-size:13px;z-index:2;overflow:visible;will-change:left,top;cursor:default;backdrop-filter:blur(4px);background:linear-gradient(145deg,#ffffff35,#24132d66);box-shadow:0 7px 16px #210d3188,0 0 16px 2px var(--c),inset 0 1px 0 #ffffff55;transition:filter .15s,box-shadow .15s;text-shadow:0 2px 4px #12041c;letter-spacing:.5px}
.character::after{content:"";position:absolute;inset:4px;border:1px solid #ffffff38;border-radius:8px;pointer-events:none}
.character-img{width:78px;height:58px;object-fit:contain;display:block;pointer-events:none;border:2px solid #f7ddff;border-radius:9px;background:linear-gradient(135deg,#ffffff45,#7b3b9c66);box-shadow:0 3px 10px #1d082aaa;padding:2px}
.weapon-label{font-size:10px;margin:4px 0;text-shadow:0 2px 3px #16051f}
#heldSword{position:absolute;width:233px;height:233px;object-fit:contain;left:-112px;top:12%;z-index:4;pointer-events:none;transform:rotate(-35deg);transform-origin:75% 75%;filter:drop-shadow(3px 4px 3px #24112caa)}
#heldSniper{position:absolute;width:189px;height:124px;object-fit:contain;right:-115px;top:25%;z-index:4;pointer-events:none;transform:rotate(-8deg);filter:drop-shadow(3px 4px 3px #24112caa)}
#heldBook{position:absolute;width:113px;height:113px;object-fit:contain;right:-55px;top:15%;z-index:4;pointer-events:none;transform:rotate(15deg);filter:drop-shadow(3px 4px 3px #24112caa)}
#heldCD{position:absolute;width:60px;height:60px;object-fit:contain;left:-47px;top:calc(25% - 2px);z-index:4;pointer-events:none;transform:rotate(-20deg);filter:drop-shadow(0 0 8px #b6ff3d)}
#heldDice{position:absolute;width:65px;height:65px;object-fit:contain;right:-50px;top:20%;z-index:4;pointer-events:none;transform:rotate(15deg);filter:drop-shadow(0 0 8px #ff9ff3)}
#heldChopsticks{position:absolute;width:105px;height:67px;object-fit:contain;right:-75px;top:25%;z-index:4;pointer-events:none;transform:rotate(35deg);filter:drop-shadow(0 0 6px #7cf3ff)}
#btn3.throwing #heldBook{animation:bookThrow .3s ease-out}
@keyframes bookThrow{0%{transform:rotate(15deg) scale(1)}50%{transform:rotate(-40deg) scale(1.3)}100%{transform:rotate(15deg) scale(1)}}
#btn6.throwing #heldChopsticks{animation:chopThrow .18s ease-out}
@keyframes chopThrow{0%{transform:rotate(35deg) scale(1)}45%{transform:rotate(75deg) scale(1.18)}100%{transform:rotate(35deg) scale(1)}}
#btn4.casting #heldCD{animation:cdSpin .26s linear}
@keyframes cdSpin{0%{transform:rotate(-20deg) scale(1)}40%{transform:rotate(180deg) scale(1.35) translateY(-8px)}100%{transform:rotate(340deg) scale(1)}}
#btn5.casting #heldDice{animation:diceToss .26s ease-out}
@keyframes diceToss{0%{transform:rotate(15deg) translateY(0) scale(1)}35%{transform:rotate(140deg) translateY(-20px) scale(1.35)}70%{transform:rotate(240deg) translateY(-6px) scale(1.1)}100%{transform:rotate(15deg) translateY(0) scale(1)}}
#btn1.swinging-sword #heldSword{animation:swordSwing .32s ease-in-out}
@keyframes swordSwing{0%{transform:rotate(-35deg) scale(1)}45%{transform:rotate(65deg) scale(1.2)}100%{transform:rotate(-35deg) scale(1)}}
.health-container{position:relative;width:100%;height:10px;margin-top:5px;background:#1b0f24;border:1px solid #000;border-radius:20px;overflow:hidden;box-shadow:inset 0 1px 3px #000b,0 0 6px #0008}
.health-ghost{position:absolute;left:0;top:0;height:100%;width:100%;background:#ff3b3b;transition:width .7s ease .35s;will-change:width}
.health-bar{position:absolute;left:0;top:0;height:100%;width:100%;background:linear-gradient(#8bff8b,#18b418);transition:width .12s;will-change:width}
.health-bar::after{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(#ffffff77,#ffffff08);border-radius:20px}
.health-text{font-size:13px;margin-top:4px}
.character.burning{border-color:#ff7b00;box-shadow:0 0 10px 4px #ff6a00,0 0 28px 10px #ff220099;animation:burnPulse .25s infinite alternate}
@keyframes burnPulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.flame{position:absolute;font-size:22px;pointer-events:none;z-index:9;user-select:none}
.cd-proj{position:absolute;width:41px;height:41px;object-fit:contain;z-index:6;pointer-events:none;will-change:left,top;filter:drop-shadow(0 0 8px #b6ff3d) drop-shadow(0 0 14px #5cff9a)}
.dice-proj{position:absolute;width:42px;height:42px;object-fit:contain;z-index:6;pointer-events:none;will-change:left,top;filter:drop-shadow(0 0 8px #ff9ff3) drop-shadow(0 0 14px #ff5cf0)}
.chop-flash{position:absolute;width:8px;height:8px;border-radius:50%;background:#7cf3ff;box-shadow:0 0 10px 3px #7cf3ff;pointer-events:none;z-index:7;animation:chopFlash .18s ease-out forwards}
@keyframes chopFlash{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
.book-proj{position:absolute;width:52px;height:52px;object-fit:contain;z-index:6;pointer-events:none;will-change:left,top;filter:drop-shadow(0 0 8px #ff8800) drop-shadow(0 0 16px #ff4400)}
.book-proj.reflected{width:64px;height:64px;filter:drop-shadow(0 0 8px #00ffff) drop-shadow(0 0 16px #ff6600) brightness(1.3)}
#btn1.deflect-ready{border-color:#48faff;box-shadow:0 0 8px 3px #48faff,0 0 24px 9px #00cfff99}
#btn1.deflect-flash{border-color:white;box-shadow:0 0 18px 9px white,0 0 40px 18px cyan}
.bullet{position:absolute;width:48px;height:18px;border:2px solid #d9e7ff;border-radius:4px 18px 18px 4px;background:linear-gradient(to bottom,#fff 0%,#b9d9ff 18%,#527aa8 45%,#17253e 70%,#d8ecff 100%);box-shadow:0 0 5px white,0 0 12px #60aaff,0 0 24px #278bff99;z-index:6;pointer-events:none;will-change:left,top}
.bullet:before{content:"";position:absolute;width:75px;height:12px;top:1px;right:85%;border-radius:100%;background:linear-gradient(to left,#fff,#65baffcc,#367aff55,transparent);filter:blur(3px);pointer-events:none}
.bullet:after{content:"";position:absolute;right:90%;top:5px;width:18px;height:6px;background:#eaf8ff;box-shadow:0 0 10px 4px #70bdff;border-radius:50%}
.bullet.reflected{border-color:white;background:linear-gradient(to bottom,white 0%,#aaffff 30%,#00eaff 60%,#0066ff);box-shadow:0 0 8px white,0 0 22px cyan,0 0 45px #008cff;filter:brightness(1.5)}
.bullet.reflected:before{background:linear-gradient(to left,white,cyan,#0088ff88,transparent);height:18px;filter:blur(5px)}
.bullet.super-shot{width:82px;height:36px;border:3px solid #fff0a6;border-radius:8px 35px 35px 8px;background:linear-gradient(to bottom,white 0%,#fff4a3 15%,#ffb000 38%,#ff4400 65%,#720000);box-shadow:0 0 12px 5px #ffcc00,0 0 28px 12px #ff6600,0 0 55px 20px #ff220088;z-index:7;animation:superPulse .18s infinite alternate}
.bullet.super-shot:before{width:130px;height:27px;right:90%;top:2px;background:linear-gradient(to left,white,#ffe066,#ff6600bb,#ff220033,transparent);filter:blur(5px)}
.bullet.super-shot:after{width:35px;height:18px;right:95%;top:6px;background:white;box-shadow:0 0 15px 8px #ff9900}
.bullet.super-shot.reflected{border-color:white;background:linear-gradient(to bottom,white,#aaffff 25%,#00eaff 55%,#0044ff);box-shadow:0 0 15px 8px white,0 0 35px 15px cyan,0 0 70px 25px #0044ff}
@keyframes superPulse{from{filter:brightness(1)}to{filter:brightness(1.8)}}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:5;box-shadow:0 0 8px currentColor;will-change:left,top,opacity,transform}
#muzzleFlash{position:absolute;width:45px;height:45px;border-radius:50%;background:#fff4a3;box-shadow:0 0 25px 12px orange;z-index:8;pointer-events:none;display:none}
#status{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);padding:9px 13px;border-radius:10px;font-size:13px;text-align:center;z-index:7;white-space:nowrap;pointer-events:none;border:1px solid #d36bff88;box-shadow:0 0 18px #b34bff66;backdrop-filter:blur(6px);background:linear-gradient(90deg,#24132ddd,#3a1d4cdd,#24132ddd)}
#gameover{display:none;position:fixed;inset:0;background:#000d;z-index:10;align-content:center;justify-items:center;text-align:center;font-size:30px;backdrop-filter:blur(5px);overflow:hidden}
#restart{margin-top:22px;padding:12px 24px;background:white;color:black;border:0;border-radius:8px;font-size:18px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 0 18px #fff8;position:relative;z-index:2}#restart:hover{transform:scale(1.1);box-shadow:0 0 30px #ffe66d}
.flame-ring-shot{position:absolute;width:34px;height:34px;display:grid;place-items:center;font-size:25px;z-index:6;pointer-events:none;will-change:left,top;filter:drop-shadow(0 0 8px #ff6600) drop-shadow(0 0 14px #ff2200)}
#btn1.dashing{box-shadow:0 0 16px 7px #48faff,0 0 35px 15px #00cfff99}
#btn1.dashing.deflect-ready{border-color:#48faff;box-shadow:0 0 8px 3px #48faff,0 0 24px 9px #00cfff99,0 0 35px 15px #00cfff77}
#btn1.dashing.deflect-flash{border-color:white;box-shadow:0 0 18px 9px white,0 0 40px 18px cyan,0 0 55px 20px #00cfff99}
#btn3.shielded{border-color:#ffe66d;box-shadow:0 0 12px 5px #ffe66d,0 0 32px 12px #ffb700aa;animation:shieldPulse .65s infinite alternate}
@keyframes shieldPulse{from{filter:brightness(1)}to{filter:brightness(1.35) saturate(1.5)}}
#soundGate{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:#16051fbb;text-align:center;cursor:pointer}
.sound-card{padding:24px 28px;border:2px solid #b972df;border-radius:18px;background:linear-gradient(145deg,#63307dcc,#271133ee);box-shadow:0 0 32px #bb5effaa;font-weight:bold;font-size:20px}
.sound-card small{display:block;margin-top:9px;font-size:13px;color:#f0d8ff;font-weight:normal}
.powerup{--pc:#ffe66d;position:absolute;width:42px;height:42px;display:grid;place-items:center;font-size:24px;z-index:3;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#ffffff66,#ffffff12);border:2px solid var(--pc);box-shadow:0 0 14px 5px var(--pc),0 0 34px 12px color-mix(in srgb,var(--pc) 55%,transparent);animation:puFloat .8s infinite alternate;will-change:transform}
.powerup::before{content:"";position:absolute;inset:-8px;border:1px dashed var(--pc);border-radius:50%;animation:spin 3s linear infinite;opacity:.9}
@keyframes puFloat{from{transform:translateY(0) scale(1)}to{transform:translateY(-6px) scale(1.12)}}
.powerup.expiring{animation:puBlink .25s infinite alternate}
@keyframes puBlink{from{opacity:1}to{opacity:.25}}
.character.powershield{border-color:#7cff7c;box-shadow:0 0 12px 5px #7cff7c,0 0 30px 12px #00ff8099}
.character.speedboost{border-color:#ffe14a;box-shadow:0 0 calc(14px*var(--boost,1)) calc(6px*var(--boost,1)) #ffe14a,0 0 calc(32px*var(--boost,1)) calc(12px*var(--boost,1)) #ffb30099}
.trail{position:absolute;border-radius:12px;pointer-events:none;z-index:1;animation:trailFade .38s ease-out forwards;will-change:opacity,transform}
.fxring{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid var(--rc,#fff);box-shadow:0 0 14px var(--rc,#fff),inset 0 0 10px var(--rc,#fff);pointer-events:none;z-index:8;animation:ringExpand .55s ease-out forwards;will-change:transform,opacity}
.ftext{position:absolute;font-weight:900;font-size:22px;pointer-events:none;z-index:12;color:var(--fc,#fff);text-shadow:0 2px 0 #000,0 0 10px var(--fc,#fff);animation:floatUp .9s ease-out forwards;white-space:nowrap;will-change:transform,opacity}
.ftext.big{font-size:34px}
.confetti{position:absolute;top:-20px;width:10px;height:16px;opacity:.9;animation:confFall linear forwards}
#winner{font-size:44px;font-weight:900;background:linear-gradient(90deg,#fff,#ffe66d,#ff8cf0,#7cf3ff,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleShine 3s linear infinite,winPop .6s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 0 16px #d36bff)}
@keyframes titleShine{to{background-position:250% 0}}
@keyframes icoBob{from{transform:rotate(-12deg) scale(1)}to{transform:rotate(12deg) scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes trailFade{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(.85)}}
@keyframes ringExpand{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(var(--k,5));opacity:0}}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{transform:translate(-50%,-10px) scale(1.25);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
@keyframes confFall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes winPop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:600px){h1{font-size:15px;margin:6px 0;letter-spacing:1px}#arena{width:98vw;height:88vh;top:50%}.character{font-size:11px;padding:4px}.character-img{width:52px;height:40px}.weapon-label{display:none}.health-container{height:8px;margin-top:3px}.health-text{font-size:9px;margin-top:1px}#heldSword{width:69px;height:69px;left:-38px;top:5%}#heldSniper{width:65px;height:46px;right:-34px;top:15%}#heldBook{width:28px;height:28px;right:-22px;top:10%}.bullet{width:32px;height:13px}.bullet.super-shot{width:47px;height:23px}.book-proj{width:30px;height:30px}.flame-ring-shot{width:22px;height:22px;font-size:15px}.powerup{width:30px;height:30px;font-size:18px}#status{max-width:96vw;white-space:normal;font-size:10px;padding:6px 8px}#matchTimer{top:4px;font-size:14px;padding:3px 8px;max-width:46vw}#killFeed{top:34px;right:6px;max-width:calc(52vw - 8px)}.feed-item{font-size:10px;padding:4px 7px}}
.character.team-a{border-color:#48faff!important;box-shadow:0 0 18px 4px #48faffcc,inset 0 0 0 2px #48faff55!important}
.character.team-b{border-color:#ff5c7a!important;box-shadow:0 0 18px 4px #ff5c7acc,inset 0 0 0 2px #ff5c7a55!important}
.fighter-hidden{display:none !important}
.character.casting{animation:castShake .26s ease}
.character.chopping{animation:chopLunge .18s ease-out}
.cd-charge,.dice-charge{position:absolute;width:68px;height:68px;pointer-events:none;z-index:8;animation:chargePop .42s ease-out forwards}
.cd-charge{border-radius:50%;border:3px solid #b6ff3d;box-shadow:0 0 22px #b6ff3d,inset 0 0 18px #b6ff3d66}
.dice-charge{border-radius:22%;border:3px solid #ff9ff3;box-shadow:0 0 22px #ff9ff3,inset 0 0 18px #ff9ff366}
.cd-proj.golden-cd{border-color:#ffe66d;color:#ffe66d;filter:drop-shadow(0 0 14px #ffe66d) drop-shadow(0 0 24px #ffaa00);animation:goldenPulse .35s infinite alternate}
.dice-proj{filter:drop-shadow(0 0 10px #ff9ff3)}
.chop-arc{position:absolute;width:140px;height:140px;border-radius:50%;border:4px solid transparent;border-top-color:#7cf3ff;box-shadow:0 0 18px #7cf3ff88;pointer-events:none;z-index:8;transform:rotate(var(--rot,0rad));animation:arcSwipe .28s ease-out forwards}
@keyframes castShake{0%{transform:translate(0,0) scale(1)}35%{transform:translate(-3px,2px) scale(1.05)}70%{transform:translate(3px,-2px) scale(.98)}100%{transform:translate(0,0) scale(1)}}
@keyframes chopLunge{0%{transform:scale(1)}45%{transform:scale(1.09) rotate(3deg)}100%{transform:scale(1)}}
@keyframes chargePop{0%{transform:scale(.25);opacity:.15}55%{transform:scale(1.08);opacity:.95}100%{transform:scale(1.45);opacity:0}}
@keyframes goldenPulse{from{filter:drop-shadow(0 0 8px #ffe66d)}to{filter:drop-shadow(0 0 22px #ffaa00)}}
@keyframes arcSwipe{0%{transform:rotate(var(--rot,0rad)) scale(.45);opacity:0}30%{opacity:1}100%{transform:rotate(calc(var(--rot,0rad) + 80deg)) scale(1.15);opacity:0}}
.info-btn{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;border:1px solid #ffffff66;background:#00000055;color:white;font-weight:bold;font-size:12px;cursor:pointer;line-height:1}
.info-btn:hover{background:#ffffff33;border-color:white}
.pick{position:relative}
#charInfoPanel{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:#000000aa;backdrop-filter:blur(4px)}
.char-info-card{width:min(520px,92vw);max-height:80vh;overflow:auto;padding:20px;border:2px solid #b972df;border-radius:16px;background:linear-gradient(145deg,#3a1a52ee,#1c0c28ee);box-shadow:0 0 34px #bb5effaa;text-align:left}
#charInfoTitle{font-size:24px;font-weight:900;margin-bottom:10px;color:#ffe66d;text-align:center}
#charInfoBody{font-size:14px;line-height:1.5;margin-bottom:14px}
#charInfoClose{width:100%;padding:10px;border:0;border-radius:10px;background:white;color:#2a0f3f;font-weight:bold;cursor:pointer}

:root{--gold:#ffe66d;--cyan:#48faff;--pink:#ff9ff3;--lime:#b6ff3d;--purple:#b972df}
body{background:radial-gradient(1200px 700px at 20% -10%,#3a1a52 0%,transparent 60%),radial-gradient(1000px 600px at 90% 110%,#123a4a 0%,transparent 55%),linear-gradient(160deg,#1b0c28,#0d0616)}

  const online=window.__online;if(!online||online.roundOver||online.role!=="guest")return;
  online.roundOver=true;gameEnded=true;
  online.hostWins=data.hostWins;online.guestWins=data.guestWins;
  const nextMap=data.nextMap;
  window.__onlineUpdateRoundScore();
  if(data.matchOver){window.__onlineFinishMatch();return;}
  statusBar.textContent="Round finished — next map: "+nextMap.toUpperCase();
  setTimeout(function(){const o=window.__online;if(o&&o.hostWins<2&&o.guestWins<2)window.startOnlineMatch(o.hostPick,o.guestPick,nextMap);},2200);
};
window.startOnlineMatch=function(hostIndex,guestIndex,map){
  const online=window.__online;
  online.hostPick=hostIndex;online.guestPick=guestIndex;
  selected=[hostIndex,guestIndex];fightMode=1;selectedMap=ONLINE_MAPS.includes(map)?map:"boxing";
  teams=[[allChars[hostIndex]],[allChars[guestIndex]]];buttons=teams.flat();
  allChars.forEach(function(c){c.el.classList.add("fighter-hidden");c.el.classList.remove("team-a","team-b");c.hp=MAX_HP;c.alive=true;c.placed=false;c.vx=0;c.vy=0;setHpBar(c);});
  buttons.forEach(function(c){c.el.classList.remove("fighter-hidden");});
  menu.style.display="none";document.getElementById("mapSelect").style.display="none";document.getElementById("gameover").style.display="none";
  gameEnded=false;started=false;paused=false;online.roundOver=false;window.__onlineUpdateRoundScore();buildMap();startGame();
  if(online.role==="host"&&!online.snapshotTimer){online.snapshotTimer=setInterval(function(){if(!online.started||gameEnded||!buttons.length)return;online.socket.volatile.emit("state",{chars:buttons.map(function(c){return{i:allChars.indexOf(c),x:Math.round(c.x),y:Math.round(c.y),hp:Math.round(c.hp),alive:c.alive};})});},33);}
};
window.applyOnlineState=function(state){if(!state||!state.chars)return;state.chars.forEach(function(s){const c=allChars[s.i];if(!c)return;c.__netX=s.x;c.__netY=s.y;c.hp=s.hp;c.alive=s.alive;c.el.style.display=c.alive?"":"none";setHpBar(c);});};
</script>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  const online={role:null,hostPick:null,guestPick:null,myPick:null,started:false,input:{up:false,down:false,left:false,right:false},socket:null,snapshotTimer:null,hostWins:0,guestWins:0,roundOver:false,opponentPick:null,inputDirty:false};
  window.__online=online;
  const $=id=>document.getElementById(id);
  const lobby=$("onlineLobby"),landing=$("onlineLanding"),room=$("onlineRoom"),error=$("onlineError"),code=$("onlineRoomCode"),message=$("onlineRoomMessage"),status=$("onlineConnectionStatus"),fighters=$("onlineFighters"),choice=$("onlineChoiceStatus");
  function open(){lobby.classList.add("open");error.textContent="";if(typeof renderFighters==="function")renderFighters();}
  function resetUI(){landing.hidden=false;room.hidden=true;error.textContent="";status.textContent="Waiting for Player 2…";fighters.innerHTML="";choice.textContent="No fighter selected";online.hostPick=null;online.guestPick=null;online.myPick=null;online.opponentPick=null;online.started=false;selected=[];fightMode=1;renderPicks();updateMenu();}
  function close(){lobby.classList.remove("open");}
  function showRoom(roomCode,text){landing.hidden=true;room.hidden=false;code.textContent=roomCode;status.textContent=text;renderFighters();}
  function renderFighters(){
    fighters.innerHTML="";
    charInfo.forEach((c,index)=>{
      const btn=document.createElement("button");btn.type="button";btn.className="online-fighter"+(online.myPick===index?" selected":"");btn.disabled=online.started||index===online.opponentPick;
      btn.innerHTML='<img src="'+c.img+'" alt="'+c.name+'"><span>'+c.name+'</span>';
      btn.onclick=()=>selectFighter(index);fighters.appendChild(btn);
    });
  }
  function selectFighter(index){
    if(online.started||index===online.opponentPick)return;
    online.myPick=index;
    if(online.role==="host")online.hostPick=index;else online.guestPick=index;
    choice.textContent="Selected: "+charInfo[index].name+". Waiting for the other player…";
    online.socket.emit("selectFighter",{index});renderFighters();tryStart();
  }
  function tryStart(){
    if(online.role!=="host"||online.started||online.hostPick===null||online.guestPick===null||online.hostPick===online.guestPick)return;
    online.started=true;const firstMap=window.__randomOnlineMap();online.socket.emit("startMatch",{hostPick:online.hostPick,guestPick:online.guestPick,map:firstMap});startMatch(online.hostPick,online.guestPick,firstMap);
  }
  function startMatch(hostPick,guestPick){
    if(online.started===false)online.started=true;
    close();
    window.startOnlineMatch(hostPick,guestPick);
  }
  function makeSocket(){
    if(online.socket)return;
    online.socket=io({transports:["websocket"],upgrade:false,reconnection:true,reconnectionAttempts:5,reconnectionDelay:800,reconnectionDelayMax:2500,timeout:8000});
    online.socket.on("connect_error",()=>{error.textContent="Could not connect. Refresh the page and try again.";});
    online.socket.on("lobbyError",text=>{error.textContent=text;});
    online.socket.on("lobbyCreated",data=>{online.role="host";message.textContent="Share this code with Player 2:";showRoom(data.code,"Waiting for Player 2… You can choose your fighter now.");});
    online.socket.on("lobbyJoined",data=>{online.role="guest";message.textContent="Joined room:";showRoom(data.code,"Choose your fighter. The host starts when both players choose.");});
    online.socket.on("guestJoined",()=>{status.textContent="Player 2 joined. Choose your fighter.";renderFighters();});
    online.socket.on("opponentSelected",data=>{if(online.role==="host")online.guestPick=data.index;else online.hostPick=data.index;online.opponentPick=data.index;renderFighters();status.textContent="Opponent selected "+charInfo[data.index].name+".";tryStart();});
    online.socket.on("startMatch",data=>{if(online.started)return;online.started=true;startMatch(data.hostPick,data.guestPick,data.map);});
    online.socket.on("guestInput",data=>{online.input=data;});
    online.socket.on("state",data=>{if(online.role==="guest")window.applyOnlineState(data);});
    online.socket.on("roundEnd",data=>{window.__onlineApplyRoundEnd(data);});
    online.socket.on("hostDisconnected",()=>{alert("Host disconnected.");location.reload();});
    online.socket.on("guestDisconnected",()=>{if(online.role==="host")status.textContent="Player 2 disconnected.";});
  }
  $("onlineModeBtn").onclick=()=>{resetUI();makeSocket();open();};
  $("onlineBackBtn").onclick=()=>{close();};
  $("createLobbyBtn").onclick=()=>{makeSocket();online.socket.emit("createLobby");};
  $("joinLobbyBtn").onclick=()=>{makeSocket();online.socket.emit("joinLobby",{code:$("joinCodeInput").value.trim().toUpperCase()});};
  $("joinCodeInput").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());
  window.addEventListener("keydown",e=>{if(online.role!=="guest"||!online.started)return;if(["ArrowUp","w","W"].includes(e.key))online.input.up=true;online.inputDirty=true;online.socket.emit("guestInput",online.input);if(["ArrowDown","s","S"].includes(e.key))online.input.down=true;online.inputDirty=true;online.socket.emit("guestInput",online.input);if(["ArrowLeft","a","A"].includes(e.key))online.input.left=true;online.inputDirty=true;online.socket.emit("guestInput",online.input);if(["ArrowRight","d","D"].includes(e.key))online.input.right=true;online.inputDirty=true;online.socket.emit("guestInput",online.input);});
  window.addEventListener("keyup",e=>{if(online.role!=="guest"||!online.started)return;if(["ArrowUp","w","W"].includes(e.key))online.input.up=false;online.inputDirty=true;online.socket.emit("guestInput",online.input);if(["ArrowDown","s","S"].includes(e.key))online.input.down=false;online.inputDirty=true;online.socket.emit("guestInput",online.input);if(["ArrowLeft","a","A"].includes(e.key))online.input.left=false;online.inputDirty=true;online.socket.emit("guestInput",online.input);if(["ArrowRight","d","D"].includes(e.key))online.input.right=false;online.inputDirty=true;online.socket.emit("guestInput",online.input);});
  setInterval(()=>{if(online.role==="guest"&&online.started&&online.socket&&online.inputDirty){online.inputDirty=false;online.socket.emit("guestInput",online.input);}},50);
})();
</script>
